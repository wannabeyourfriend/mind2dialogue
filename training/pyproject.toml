[project]
name = "mind2dialogue-training"
version = "0.1.0"
description = "Response-only LoRA training for Mind2Dialogue"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.12.0",
    "unsloth>=2024.12.0",
    "trl>=0.12.0",
    "sentencepiece>=0.2.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
logging = ["wandb>=0.18.0"]

[tool.uv]
package = false
